name: Daily Auto Blog Poster

on:
  schedule:
    # UTC 기준 매일 22:00 (한국 시간 KST 기준 매일 아침 07:00 실행)
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 버튼을 눌러 수동 즉시 실행도 가능

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Blog Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASS: ${{ secrets.WORDPRESS_APP_PASS }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          MEDIUM_USER_ID: ${{ secrets.MEDIUM_USER_ID }}
          VELOG_ACCESS_TOKEN: ${{ secrets.VELOG_ACCESS_TOKEN }}
          VELOG_REFRESH_TOKEN: ${{ secrets.VELOG_REFRESH_TOKEN }}
        # 초기에는 안정적인 API 방식 플랫폼(blogger, wordpress, medium, velog) 우선 실행
        run: python auto_blog_poster.py --platforms blogger,wordpress,medium,velog
