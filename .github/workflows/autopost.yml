name: Auto Blog Poster (Multi-Platform KO/EN)

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome for Headless Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install google-genai requests markdown google-api-python-client google-auth selenium

      - name: Run Auto Blog Poster (KO + EN across all configured platforms)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TISTORY_IT_BLOG_NAME: aaroneom
          TISTORY_FAMILY_BLOG_NAME: lhimepapa
          TISTORY_COOKIES_JSON: ${{ secrets.TISTORY_COOKIES_JSON }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASS: ${{ secrets.WORDPRESS_APP_PASS }}
          VELOG_REFRESH_TOKEN: ${{ secrets.VELOG_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python auto_blog_poster.py --platforms all --langs ko,en

      - name: Upload failure screenshots (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: logs/
