# 저장소의 .github/workflows/autopost.yml 로 저장하세요.
# GitHub Actions 에서는 API 플랫폼(블로거/워드프레스/벨로그)만 실행합니다.
# 티스토리·네이버·브런치는 로그인된 크롬이 필요해서 '내 PC'에서 실행해야 합니다.
name: auto-blog-poster

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  schedule:
    - cron: "0 0 * * *"       # 매일 09:00 (KST). 필요 없으면 이 두 줄 삭제

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install google-genai requests markdown google-api-python-client google-auth

      - name: 블로거 토큰 파일 생성
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: printf '%s' "$BLOGGER_TOKEN_JSON" > token.json

      - name: 포스팅 실행
        run: python auto_blog_poster.py --platforms api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}   # 선택
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}   # 선택 (Openverse 403 이면 등록)
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASS: ${{ secrets.WORDPRESS_APP_PASS }}
          VELOG_REFRESH_TOKEN: ${{ secrets.VELOG_REFRESH_TOKEN }}
          VELOG_ACCESS_TOKEN: ${{ secrets.VELOG_ACCESS_TOKEN }}     # 선택

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

