name: Coupang Shorts & Reels Auto Bot (4 Daily)

on:
  schedule:
    # 한국시간(KST) 매일 오전 11시 30분 (UTC 02:30) & 오후 5시 30분 (UTC 08:30)
    - cron: '30 2,8 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '생성 및 업로드할 숏폼 개수 (기본 2개)'
        required: false
        default: '2'

jobs:
  publish-shorts-reels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Google Chrome for Headless Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          pip install google-genai requests pillow moviepy==1.0.3 edge-tts google-api-python-client google-auth-oauthlib selenium

      - name: Run Coupang Shorts & Reels Bot (2 videos per run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          INPOCK_ADMIN_URL: ${{ secrets.INPOCK_ADMIN_URL }}
          INPOCK_COOKIES_JSON: ${{ secrets.INPOCK_COOKIES_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT="${{ github.event.inputs.count || '2' }}"
          python coupang_shorts_reels_bot.py --count "$COUNT"

      - name: Upload failure logs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-error-logs
          path: logs/
